#
# Build
#
name: build-and-publish

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:

env:
  PACKAGES: worker

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      node-version: 20

    permissions:
      contents: read


    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      #     cache: yarn
      #     cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare correct Yarn version
        run: corepack prepare yarn@4.1.0 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build package
        run: yarn build

      #
      # Run all tests
      #
      - name: Test
        run: cat package.json && yarn run test

  tag-and-publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      node-version: 20

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        package: [worker] #${{ env.PACKAGES }}

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      #     cache: yarn
      #     cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare correct Yarn version
        run: corepack prepare yarn@4.1.0 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build package
        run: yarn build

      #
      # Tag + publish
      #
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Extract metadata (tags, labels) for Docker
        if: github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ matrix.package }}

          tags: |
            type=sha,format=short,length=6

            # `latest` only on main
            type=raw,value=latest,enable={{is_default_branch}}

            # Semver tags from git tags, i.e. v1.2.3
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker images
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: ${{ matrix.package }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  #
  # Delete latest N pre-release images from GHCR
  #
  cleanup-ghcr:
    runs-on: ubuntu-latest
    needs: tag-and-publish
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write

    strategy:
      matrix:
        package: [worker]

    steps:
      - name: Delete old images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-pre-release-versions: true
