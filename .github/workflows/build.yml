#
# Build, test, and publish all Tern packages to GitHub Packages (npm).
#
# Publish runs only on pushes to main / release/* after tests pass.
# Packages are published in dependency order so consumers never see a package
# before its transitive dependencies are available.
#
# Required secrets: none — the automatic GITHUB_TOKEN has packages:write.
#
# Consuming the published packages outside this monorepo:
#   Add to your .yarnrc.yml:
#
#     npmScopes:
#       system:
#         npmRegistryServer: "https://npm.pkg.github.com"
#         npmAlwaysAuth: true
#
#   Then authenticate:
#     YARN_NPM_AUTH_TOKEN=<github-pat-packages-read> yarn install
#
name: build-and-publish

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:

env:
  # actions/delete-package-versions@v5 still targets node20; force it onto
  # node24 until the action publishes a native node24 release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── 1. Build + test ──────────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Corepack must be enabled before setup-node so that the `cache: yarn`
      # option resolves the cache directory with Yarn 4, not the pre-installed
      # Yarn 1.22 that ships on the runner.
      - name: Enable Corepack
        run: corepack enable

      - name: Activate Yarn 4.1.0
        run: corepack prepare yarn@4.1.0 --activate

      - name: Setup Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Stamp version info
        run: yarn stamp

      - name: Build all packages
        run: yarn build

      - name: Run test suite
        run: yarn test

  # ── 2. Build and push Docker images to GHCR ──────────────────────────────────
  docker:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: server
            image: system-server
          - name: web
            image: system-web

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.target.image }}
          tags: |
            type=sha,format=short,length=8
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build and push ${{ matrix.target.name }}
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          target: ${{ matrix.target.name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 3. Publish npm packages to GitHub Packages ────────────────────────────────
  publish:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Enable Corepack
        run: corepack enable

      - name: Activate Yarn 4.1.0
        run: corepack prepare yarn@4.1.0 --activate

      - name: Setup Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Stamp version info
        run: yarn stamp

      - name: Build all packages
        # Full build required so compiled artefacts exist for packing.
        # TypeScript project references enforce correct dependency order.
        run: yarn build

      - name: Scope packages to repository owner
        # GitHub Packages for npm requires the package scope to match the
        # repository owner.  Patch every publishable package.json in-place:
        #   @system/core → @{owner}/core
        # Also updates cross-package dependency keys so Yarn's workspace:^
        # expansion produces the correct scoped names in published manifests.
        run: |
          OWNER="${{ github.repository_owner }}"
          for pkg in api app auth core data entities flow gen vaults; do
            tmp=$(mktemp)
            # Replace all "@system/ occurrences in JSON string values (they
            # are always double-quoted in valid JSON, so this is safe).
            sed "s|\"@system/|\"@${OWNER}/|g" "packages/${pkg}/package.json" > "$tmp"
            mv "$tmp" "packages/${pkg}/package.json"
          done

      - name: Append short SHA to package versions
        # Every merge to main produces a unique pre-release version
        # e.g. 0.1.0 → 0.1.0-abc1234  so re-runs never hit a 409.
        # The workspace package.json files are not committed; this only
        # affects the transient copies used inside this job.
        run: |
          SHORT="${GITHUB_SHA::7}"
          for pkg in api app auth core data entities flow gen vaults; do
            node -e "
              const fs = require('fs');
              const p  = JSON.parse(fs.readFileSync('packages/$pkg/package.json', 'utf8'));
              p.version = p.version + '-' + '$SHORT';
              fs.writeFileSync('packages/$pkg/package.json', JSON.stringify(p, null, 2) + '\n');
            "
            echo "  $pkg → $(node -e "process.stdout.write(require('./packages/$pkg/package.json').version)")"
          done

      - name: Publish packages
        # Publishes in dependency order so consumers never see a package whose
        # deps are not yet in the registry.
        # Yarn converts workspace:^ → ^<version> automatically when packing.
        # A 409 or "already published" response is treated as success so
        # re-runs are safe.  All other non-zero exits (including 403 scope
        # errors) surface as real failures.
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          fail=0

          publish_pkg() {
            local pkg="$1"
            echo ""
            echo "──────────────────────────────────────────"
            echo "  Publishing @${OWNER}/${pkg} …"
            echo "──────────────────────────────────────────"

            local out
            out=$(cd "packages/$pkg" && yarn npm publish --access public 2>&1) && {
              echo "$out"
              echo "  ✓ @${OWNER}/${pkg} published"
              return 0
            }

            # 409 / "already published" → idempotent skip (not an error).
            # Matches both the legacy npm E409 code and Yarn 4's YN0035 format:
            #   YN0035: Cannot publish over existing version
            # 403 is intentionally NOT in this list — a scope/permission
            # mismatch must surface as a real failure.
            if echo "$out" | grep -qiE "already exists|already been published|E409|YN0035|Cannot publish over existing"; then
              echo "$out"
              echo "  ↳ version already in registry — skipping"
              return 0
            fi

            echo "$out"
            echo "  ✗ @${OWNER}/${pkg} failed"
            fail=1
          }

          # Layer 0 — no @{owner} deps
          publish_pkg core
          publish_pkg vaults

          # Layer 1 — depend only on @{owner}/core (or core + flow)
          publish_pkg data
          publish_pkg flow
          publish_pkg gen
          publish_pkg api
          publish_pkg app

          # Layer 2 — depends on core + data + gen
          publish_pkg entities

          # Layer 3 — depends on core + data + entities + flow
          publish_pkg auth

          exit $fail
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Prune stale pre-release versions ──────────────────────────────────────
  cleanup:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        package: [api, app, auth, core, data, entities, flow, gen, vaults]

    steps:
      - name: Prune old pre-release versions of @${{ github.repository_owner }}/${{ matrix.package }}
        # continue-on-error: package may not exist yet on first publish
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: npm
          min-versions-to-keep: 10
          delete-only-pre-release-versions: true
