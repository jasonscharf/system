#
# Build, test, and publish all Tern packages to GitHub Packages (npm).
#
# Publish runs only on pushes to main / release/* after tests pass.
# Packages are published in dependency order so consumers never see a package
# before its transitive dependencies are available.
#
# Required secrets: none — the automatic GITHUB_TOKEN has packages:write.
#
# Consuming the published packages outside this monorepo:
#   Add to your .yarnrc.yml:
#
#     npmScopes:
#       system:
#         npmRegistryServer: "https://npm.pkg.github.com"
#         npmAlwaysAuth: true
#
#   Then authenticate:
#     YARN_NPM_AUTH_TOKEN=<github-pat-packages-read> yarn install
#
name: build-and-publish

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:

env:
  # Run action runner tooling (checkout, setup-node, etc.) on Node 24
  # instead of the deprecated Node 20 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── 1. Build + test ──────────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # Corepack must be enabled before setup-node so that the `cache: yarn`
      # option resolves the cache directory with Yarn 4, not the pre-installed
      # Yarn 1.22 that ships on the runner.
      - name: Enable Corepack
        run: corepack enable

      - name: Activate Yarn 4.1.0
        run: corepack prepare yarn@4.1.0 --activate

      - name: Setup Node 20
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build all packages
        run: yarn build

      - name: Run test suite
        run: yarn test

  # ── 2. Build and push Docker images to GHCR ──────────────────────────────────
  docker:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: server
            image: system-server
          - name: web
            image: system-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.target.image }}
          tags: |
            type=sha,format=short,length=8
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.target.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target.name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 3. Publish npm packages to GitHub Packages ────────────────────────────────
  publish:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Enable Corepack
        run: corepack enable

      - name: Activate Yarn 4.1.0
        run: corepack prepare yarn@4.1.0 --activate

      - name: Setup Node 20
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build all packages
        # Full build required so compiled artefacts exist for packing.
        # TypeScript project references enforce correct dependency order.
        run: yarn build

      - name: Publish packages
        # Yarn converts workspace:^ → ^<version> automatically when packing.
        # Publishing in dependency order ensures no consumer ever sees a package
        # whose dependencies are not yet in the registry.
        # Already-published versions are skipped so re-runs and PR merges are safe.
        run: |
          set -euo pipefail
          fail=0

          publish_pkg() {
            local pkg="$1"
            echo ""
            echo "──────────────────────────────────────────"
            echo "  Publishing @system/$pkg …"
            echo "──────────────────────────────────────────"

            local out
            out=$(cd "packages/$pkg" && yarn npm publish --access public 2>&1) && {
              echo "$out"
              echo "  ✓ @system/$pkg published"
              return 0
            }

            # Treat "already exists" as a non-error (idempotent re-runs)
            if echo "$out" | grep -qiE "already exists|already been published|E409|403"; then
              echo "$out"
              echo "  ↳ version already in registry — skipping"
              return 0
            fi

            echo "$out"
            echo "  ✗ @system/$pkg failed"
            fail=1
          }

          # Layer 0: no @system deps
          publish_pkg core
          publish_pkg worker

          # Layer 1: depend only on @system/core
          publish_pkg data
          publish_pkg flow
          publish_pkg gen
          publish_pkg api

          # Layer 2: depends on core + data + flow
          publish_pkg auth

          # Standalone (no @system deps)
          publish_pkg secrets

          exit $fail
        env:
          # .yarnrc.yml reads ${YARN_NPM_AUTH_TOKEN} for GitHub Packages auth
          YARN_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Prune stale pre-release versions ──────────────────────────────────────
  cleanup:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        package: [api, auth, core, data, flow, gen, secrets, worker]

    steps:
      - name: Prune old pre-release versions of @system/${{ matrix.package }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: npm
          min-versions-to-keep: 10
          delete-only-pre-release-versions: true
