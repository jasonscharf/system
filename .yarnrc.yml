nodeLinker: node-modules

# ── GitHub Packages ────────────────────────────────────────────────────────────
# Publishing:  set YARN_NPM_AUTH_TOKEN to a GitHub PAT with packages:write scope
#              (in CI this is the built-in GITHUB_TOKEN).
# Installing:  consumers outside this monorepo need YARN_NPM_AUTH_TOKEN set to a
#              PAT with packages:read scope.
# Local dev:   workspace:^ dependencies are always resolved locally; no token needed.
npmRegistries:
  "https://npm.pkg.github.com":
    npmAlwaysAuth: true
    npmAuthToken: "${YARN_NPM_AUTH_TOKEN:-}"

npmScopes:
  system:
    npmRegistryServer: "https://npm.pkg.github.com"
    npmAlwaysAuth: true
