services:

  #
  # Build
  #
  builder:
    build:
      context: .
      target: dev

    command: yarn watch
    volumes:
      - ./:/app

  #
  # Test
  #
  test:
    build:
      context: .
      target: test

    command: yarn test start:debug
    stop_grace_period: 1s
    tty: true
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SYS_REDIS_URL: redis://redis:6379
    ports:
      - "9231:9231"
    volumes:
      - ./:/app

  #
  # Worker
  #
  worker:
    build:
      context: .
      target: worker

    entrypoint: []
    command: yarn workspace @jasonscharf/worker start:debug
    stop_grace_period: 1s
    ports:
      - "9230:9000"
    volumes:
      - ./:/app

  #
  # Redis  —  sessions + domain event streams
  #
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  #
  # PostgreSQL  —  shared by sandbox-server
  #
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       system
      POSTGRES_USER:     sys
      POSTGRES_PASSWORD: sys
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sys -d sys"]
      interval: 5s
      timeout: 5s
      retries: 10

  #
  # Sandbox server  —  WS :8080, HTTP :8081, inspector :9229
  #
  sandbox-server:
    build:
      context: .
      target: base

    command: yarn sb-server start:debug
    stop_grace_period: 1s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYS_PG_HOST:     postgres
      SYS_PG_DATABASE: sys
      SYS_PG_USER:     sys
      SYS_PG_PASSWORD: sys
    ports:
      - "8080:8080"
      - "8081:8081"
      - "9229:9229"
    volumes:
      - ./:/app

  #
  # Sandbox web  —  Vite dev server :5173
  #
  sandbox-web:
    build:
      context: .
      target: base

    command: yarn sb-web dev
    stop_grace_period: 1s
    ports:
      - "5173:5173"
    volumes:
      - ./:/app

volumes:
  postgres_data:
