services:

  #
  # Observability — Jaeger distributed tracing
  #
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  #
  # Observability — Prometheus metrics
  #
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  #
  # Observability — Grafana dashboards
  #
  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    depends_on:
      - prometheus
      - jaeger

  #
  # Build
  #
  builder:
    build:
      context: .
      target: dev

    command: yarn watch
    volumes:
      - ./:/app

  #
  # Test
  #
  test:
    build:
      context: .
      target: test

    command: yarn test start:debug
    stop_grace_period: 1s
    tty: true
    depends_on:
      redis:
        condition: service_healthy
    environment:
      TERN_REDIS_URL: redis://redis:6379
    ports:
      - "9231:9231"
    volumes:
      - ./:/app

  #
  # Worker
  #
  worker:
    build:
      context: .
      target: worker

    entrypoint: []
    command: yarn workspace @jasonscharf/worker start:debug
    stop_grace_period: 1s
    environment:
      OTEL_SERVICE_NAME: worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_PROMETHEUS_PORT: "9465"
      LOG_LEVEL: info
    ports:
      - "9230:9000"
      - "9465:9465"
    volumes:
      - ./:/app

  #
  # Redis  —  sessions + domain event streams
  #
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  #
  # PostgreSQL  —  shared by sandbox-server
  #
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       tern
      POSTGRES_USER:     tern
      POSTGRES_PASSWORD: tern
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tern -d tern"]
      interval: 5s
      timeout: 5s
      retries: 10

  #
  # Sandbox server  —  WS :8080, HTTP :8081, inspector :9229, metrics :9464
  #
  sandbox-server:
    build:
      context: .
      target: base

    command: yarn sb-server start:debug
    stop_grace_period: 1s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OTEL_SERVICE_NAME: sandbox-server
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_PROMETHEUS_PORT: "9464"
      LOG_LEVEL: info
      TERN_PG_HOST:     postgres
      TERN_PG_DATABASE: tern
      TERN_PG_USER:     tern
      TERN_PG_PASSWORD: tern
    ports:
      - "8080:8080"
      - "8081:8081"
      - "9229:9229"
      - "9464:9464"
    volumes:
      - ./:/app

  #
  # Sandbox web  —  Vite dev server :5173
  #
  sandbox-web:
    build:
      context: .
      target: base

    command: yarn sb-web dev
    stop_grace_period: 1s
    ports:
      - "5173:5173"
    volumes:
      - ./:/app

volumes:
  postgres_data:
  grafana_data:
