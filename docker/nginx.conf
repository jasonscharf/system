server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Expose a cheap health endpoint nginx can answer without touching upstream
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # WebSocket proxy → server:8080
    # The client connects to wss://<host>/ws; nginx upgrades and forwards.
    location /ws {
        proxy_pass         http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # Auth HTTP proxy → server:8081
    # Covers /auth/google, /auth/github, /auth/me, /auth/logout, etc.
    location /auth {
        proxy_pass         http://server:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback — every unknown path returns index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires   1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Aggressive caching for Vite hashed assets
    location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }
}
