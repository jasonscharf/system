# Patch: add a persistent volume for SQLite data so it survives pod restarts.
# Remove this patch entirely to use :memory: (SYS_DB_PATH from configMapGenerator).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  template:
    spec:
      initContainers:
        - name: mkdir-data
          image: busybox:1.37
          command: [sh, -c, mkdir -p /data]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
      containers:
        - name: server
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
      volumes:
        - name: sqlite-data
          emptyDir: {}  # swap for a PVC if you want durability
