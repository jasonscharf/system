# HTTP Basic Auth credentials for the staging ingress.
#
# Generate the auth value with:
#   htpasswd -nb <user> <password> | base64 -w0
#
# Then replace the placeholder below and apply:
#   kubectl apply -n tern-staging -f k8s/overlays/staging/basic-auth-secret.yaml
#
# DO NOT commit real credentials — store them in Azure Key Vault and
# apply this secret out-of-band or via a sealed-secrets workflow.
apiVersion: v1
kind: Secret
metadata:
  name: staging-basic-auth
  namespace: tern-staging
type: Opaque
data:
  # Placeholder — replace before deploying.
  auth: REPLACE_WITH_BASE64_HTPASSWD
