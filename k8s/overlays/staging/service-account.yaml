# Azure Workload Identity ServiceAccount.
#
# Prerequisites (one-time cluster setup):
#   1. Install the Azure Workload Identity webhook:
#        az aks update --resource-group <rg> --name <cluster> --enable-oidc-issuer --enable-workload-identity
#   2. Create an Azure Managed Identity (or use an existing App Registration).
#   3. Create a Federated Identity Credential linking this ServiceAccount:
#        az identity federated-credential create \
#          --name tern-staging \
#          --identity-name <mi-name> \
#          --resource-group <rg> \
#          --issuer $(az aks show --resource-group <rg> --name <cluster> --query "oidcIssuerProfile.issuerUrl" -o tsv) \
#          --subject "system:serviceaccount:tern-staging:tern-server" \
#          --audience api://AzureADTokenExchange
#   4. Grant the Managed Identity "Key Vault Secrets User" on the vault.
#
# Replace <MANAGED_IDENTITY_CLIENT_ID> with the actual client ID:
#   az identity show --name <mi-name> --resource-group <rg> --query clientId -o tsv
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tern-server
  annotations:
    azure.workload.identity/client-id: "<MANAGED_IDENTITY_CLIENT_ID>"
