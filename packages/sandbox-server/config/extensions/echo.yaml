# tern-echo extension
# Demonstrates adding a new endpoint by dropping in an extension config file
# and referencing it from app.yaml — no changes to any existing source files.

name: tern-echo
version: "1.0.0"
description: "Sample endpoint: echoes the caller's message back uppercased with a server-side timestamp. Useful as a copy-paste template for new endpoints."

handlers:
  - type: "urn:sys:core:msg:echo"
    module: "../dist/handlers/echo.js"
    export: "handleEcho"
    priority: 100
